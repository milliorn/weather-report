---
name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep the action's own timeout (default 600s) under the job's
          # timeout-minutes, so it fails with a clear message instead of the
          # runner killing the job first.
          timeout: 300
